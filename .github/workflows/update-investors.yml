name: Update daily investor trading

on:
  schedule:
    # UTC 10:10 = KST 19:10, after Naver's end-of-day investor data is available.
    - cron: "10 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: valuation-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Naver investor trading only
        run: python scripts/collect.py --mode investors
      - name: Commit changed investor trading
        run: |
          if ! git diff --quiet -- data/stocks.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stocks.json
            git commit -m "chore: update daily investor trading"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy refreshed investor trading
        id: deployment
        uses: actions/deploy-pages@v4
