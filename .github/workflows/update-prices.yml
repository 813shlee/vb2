name: Update hourly prices

on:
  schedule:
    # GitHub schedule can be delayed near the top of the hour.
    # KST weekdays 08:47: warm-up request before the market opens.
    - cron: "47 23 * * 0-4"
    # KST weekdays 09:13~10:53: reinforce the market-open window every 20 minutes.
    - cron: "13,33,53 0-1 * * 1-5"
    # KST weekdays 11:17~16:17: update once per hour away from peak queue minutes.
    - cron: "17 2-7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: valuation-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Naver prices only
        run: python scripts/collect.py --mode price
      - name: Commit changed prices
        run: |
          if ! git diff --quiet -- data/stocks.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stocks.json
            git commit -m "chore: update hourly prices"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy refreshed prices
        id: deployment
        uses: actions/deploy-pages@v4
